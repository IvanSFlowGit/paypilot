# Fly.io deployment for PayPilot.
# Builds the Dockerfile and serves the FastAPI app on a public *.fly.dev URL.
# Runs in free demo (mock) mode by default; set OPENAI_API_KEY as a Fly secret
# to switch every node to the real model:  fly secrets set OPENAI_API_KEY=sk-...
app = "paypilot"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Point the store at the mounted volume below, not the ephemeral image.
  PAYPILOT_DB_PATH = "/data/paypilot.db"
  # The public demo is the ONE tenant `demo`. Its ledger was written before tenancy
  # existed; scripts/start.sh migrates it into this tenant on the first start and
  # records the owner. Both must match or the migration refuses.
  PAYPILOT_TENANT = "demo"
  PAYPILOT_LEGACY_TENANT = "demo"
  # The decision audit defaults to :memory:, which loses every recorded decision
  # on restart. Keep it on the volume, beside the main store.
  PAYPILOT_DECISION_AUDIT_DB_PATH = "/data/decision_audit.db"
  # The consent store defaults to the RELATIVE path "consents.db", so in the
  # container it would write into /app, which the Dockerfile makes writable, and
  # every deploy would wipe it WITHOUT ERRORING. A lost consent token is worse
  # than a lost decision row: recovering it means another consent journey with
  # somebody's bank. tests/test_fly_config.py asserts this rather than trusting
  # the comment, because before it nothing in the repository read this file.
  PAYPILOT_CONSENT_DB_PATH = "/data/consents.db"
  # The offline fake bank provider, so the consent flow can be walked end to end
  # with no aggregator and no real account. It talks to https://bank.invalid,
  # which RFC 2606 reserves so it cannot resolve anywhere, its webhook secret is
  # a constant in app/bank/fake.py marked "not a credential", and every value it
  # returns carries the marker FAKE. The real Berlin Group adapter is NOT
  # enabled by this and stays gated on a signed DPA.
  PAYPILOT_FAKE_BANK = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # ONE machine, deliberately. Fly volumes are per-machine, so a second machine
  # gets its own SQLite ledger: dedupe, the send cap and the cooldown all reset,
  # and the dashboard reports one shard as if it were the whole business.
  # Scaling horizontally needs a shared database first, not more machines.
  max_machines_running = 1
  # Keep one machine always warm so the first visitor (e.g. from a LinkedIn link)
  # never hits a cold start.
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

# The recovery ledger. Without this mount data/paypilot.db sits on the
# machine's ephemeral disk and every deploy silently wipes the record of which
# invoices failed and which were recovered - the one thing the dashboard's
# numbers are computed from. Create it once before the next deploy:
#   fly volumes create paypilot_data -a paypilot -r lhr -s 1
[mounts]
  source = "paypilot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[checks.health]
  type = "http"
  port = 8000
  method = "get"
  path = "/health"
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"

[deploy]
  release_command = "python scripts/seo_optimize.py"
