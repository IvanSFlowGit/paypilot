<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #ffffff; color: #1a2530; padding: 72px 80px; position: relative;
    border-top: 12px solid #1f3a5f;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark { width: 48px; height: 48px; border-radius: 3px; background: #1f3a5f; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 28px; }
  .brand .name { font-size: 30px; font-weight: 700; }
  h1 { font-size: 60px; line-height: 1.1; margin-top: 70px; font-weight: 700; max-width: 1000px; }
  p { font-size: 28px; color: #4f5b67; margin-top: 28px; max-width: 960px; line-height: 1.45; }
  .url { position: absolute; left: 80px; bottom: 72px; font-size: 24px; color: #1f3a5f; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand"><div class="mark">P</div><div class="name">PayPilot</div></div>
  <h1>Failed payment recovery with fixed rules and human approval</h1>
  <p>Written rules decide who is chased. A person approves every message. Nothing is sent automatically.</p>
  <div class="url">paypilot.fly.dev</div>
</body>
</html>
