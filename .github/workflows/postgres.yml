name: Postgres

# Runs scripts/pg_rls_check.py on a real cluster, on PostgreSQL 15 and 18. The unit suite parses the
# SQL and drives a fake connection; this is the only thing that executes it. Exit 2 from the script
# means "could not run", and a job step that exits non-zero is RED, so a missing cluster cannot read as
# a pass. ci.yml calls it and the deploy job needs it: a red real-cluster run blocks a deploy.
on:
  # On main this runs through ci.yml (workflow_call), so a deploy can wait on it. Every other branch
  # runs it directly, which is how a change is proven before it reaches main.
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "18"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned: docs/claims.md row 52 says behaviour on other pg8000 versions is not established.
          pip install pg8000==1.31.6

      - name: Install PostgreSQL ${{ matrix.pg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.pg }}"
          ls "/usr/lib/postgresql/${{ matrix.pg }}/bin/initdb"

      - name: Control, no cluster is RED not skipped
        # The script is pointed at a directory with no initdb in strict mode. It must exit 2. If it
        # exits 0 the job is wrong; if it exits anything else the script is wrong. Both fail here.
        run: |
          set +e
          PAYPILOT_PG_BIN_STRICT=1 PAYPILOT_PG_BIN=/nonexistent python scripts/pg_rls_check.py
          rc=$?
          echo "exit code with no cluster: $rc"
          test "$rc" -eq 2

      - name: Real-cluster check on PostgreSQL ${{ matrix.pg }}
        env:
          PAYPILOT_PG_BIN_STRICT: "1"
          PAYPILOT_PG_BIN: /usr/lib/postgresql/${{ matrix.pg }}/bin
          PAYPILOT_PG_EXPECT_MAJOR: ${{ matrix.pg }}
        run: |
          set -o pipefail
          python scripts/pg_rls_check.py | tee check.log
      - name: Publish the figures where they can be read without a login
        # Job logs need a login to read; the job summary and annotations do not. Runs even when the check
        # failed, so a red run still shows what it measured.
        if: always()
        run: |
          {
            echo "### PostgreSQL ${{ matrix.pg }}"
            echo '```'
            grep -E '^(server:|concurrency:|[0-9]+ of [0-9]+ checks)' check.log || echo "no figures: the check did not get that far"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(server:|concurrency: [0-9]+ sessions|[0-9]+ of [0-9]+ checks)' check.log \
            | while read -r line; do echo "::notice title=pg ${{ matrix.pg }}::$line"; done || true
