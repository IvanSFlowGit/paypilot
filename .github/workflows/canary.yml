name: Copy detection

# Weekly search for unlicensed copies. On a hit it opens a GitHub issue (which
# emails the owner) AND fails the job (a second email via Actions failure
# notifications). The licence is legal protection; this is how you learn a copy
# exists at all.
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write            # to open the alert issue

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Search for copies
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.CANARY_RESEND_API_KEY }}
          CANARY_ALERT_EMAIL: ${{ secrets.CANARY_ALERT_EMAIL }}
          CANARY_FROM_EMAIL: ${{ secrets.CANARY_FROM_EMAIL }}
        # A search that did not run is not a clean result. An unreadable report
        # (the script crashed) counts as incomplete for the same reason.
        run: |
          python scripts/canary.py --json > /tmp/canary.json || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              d = json.load(open("/tmp/canary.json"))
          except (OSError, ValueError):
              print("found=false")
              print("incomplete=true")
          else:
              print(f"found={'true' if d.get('github_findings') else 'false'}")
              print(f"incomplete={'true' if d.get('search_errors') else 'false'}")
          PY

      - name: Open alert issue on detection
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The body is built from our constants only (scripts/canary.py issue_body).
        # Repo names, paths and links in a hit are written by whoever published
        # the matching repo, and this issue is on a public repo.
        run: |
          body="$(python -c "import json; from scripts import canary; print(canary.issue_body(json.load(open('/tmp/canary.json'))))")"
          # One rolling issue, reopened/updated rather than a new one each week.
          num="$(gh issue list --label copy-detection --state all --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue reopen "$num" 2>/dev/null || true
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "Possible unlicensed copy detected" \
              --label copy-detection --body "$body"
          fi

      - name: Fail so Actions emails the owner
        if: steps.scan.outputs.found == 'true'
        run: |
          echo "::error::Copy detection found a fingerprint outside this repo. See the copy-detection issue."
          exit 1

      - name: Fail when the scan did not complete
        if: steps.scan.outputs.found != 'true' && steps.scan.outputs.incomplete == 'true'
        run: |
          echo "::error::Copy detection is INCOMPLETE: one or more code searches did not run, so no result is not a clean result. Re-run the workflow, or run scripts/canary.py locally."
          exit 1

      - name: Report a clean scan
        if: steps.scan.outputs.found != 'true' && steps.scan.outputs.incomplete != 'true'
        run: echo "No copies detected. Every search ran."
