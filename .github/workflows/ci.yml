name: CI

# Runs the test suite on every push and PR. The tests mock the LLM and the RAG
# retriever, so CI needs no OPENAI_API_KEY and makes no network calls at runtime.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI checks out code and runs tests, and writes nothing.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.22

      - name: Lint
        run: ruff check .

      - name: House style (no em or en dashes)
        run: python scripts/lint_style.py

      - name: Run tests
        run: pytest -q
